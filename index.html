<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b35"><title>YouTube文字起こし整形ツール</title>
<style>
:root{color-scheme:light;--ink:#1d2926;--muted:#65736e;--line:#dce5e1;--green:#176b55;--pale:#eef6f2}*{box-sizing:border-box}body{margin:0;background:#f4f7f5;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6}main{max-width:920px;margin:auto;padding:32px 18px 56px}header{margin-bottom:24px}h1{font-size:clamp(1.5rem,4vw,2.1rem);margin:0 0 6px}.sub,.note,footer{color:var(--muted)}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 5px 20px #193d3010}label{display:block;font-weight:650;margin-bottom:9px}textarea{display:block;width:100%;min-height:220px;resize:vertical;border:1px solid #cbd8d2;border-radius:12px;padding:14px;font:15px/1.7 ui-monospace,monospace;color:var(--ink)}textarea:focus{outline:3px solid #176b5522;border-color:var(--green)}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:14px 0}select{padding:10px 12px;border:1px solid #cbd8d2;border-radius:10px;background:white;font:inherit}button{border:0;border-radius:11px;padding:11px 16px;font:650 15px system-ui;cursor:pointer;background:var(--green);color:white}button.secondary{background:var(--pale);color:var(--green);border:1px solid #cfe0d8}button.ghost{background:#f1f3f2;color:#47534e}button:disabled{opacity:.45;cursor:not-allowed}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.stats,.note{font-size:13px}footer{text-align:center;font-size:12px;margin-top:22px}@media(max-width:560px){main{padding:22px 12px 40px}.panel{padding:15px}button{flex:1}textarea{min-height:190px}}
</style></head><body><main><header><h1>文字起こし整形ツール</h1><p class="sub">Transcript Guruなどからコピーした文章の、不自然な改行をまとめます。</p></header>
<section class="panel"><label for="input">① コピーした文字起こしを貼り付け</label><textarea id="input" placeholder="ここに文字起こしを貼り付けてください…"></textarea><div class="controls"><label for="mode" style="margin:0">整形方法</label><select id="mode"><option value="paragraph" selected>自然な文章（段落は残す）</option><option value="compact">改行をすべてまとめる</option><option value="sentences">句点ごとに段落を分ける</option></select><button id="format">文章を整形する</button><button class="ghost" id="clear">クリア</button></div><p class="note">※空行で区切られた段落は、通常モードでは残します。文章の内容や言葉は変更しません。</p></section>
<section class="panel"><div class="row"><label for="output">② 整形結果</label><span class="stats" id="stats">入力待ち</span></div><textarea id="output" placeholder="整形結果がここに表示されます…"></textarea><div class="controls"><button id="copy" disabled>整形結果をコピー</button><button class="secondary" id="download" disabled>TXTで保存</button></div><p class="note" id="message" aria-live="polite">処理はこのブラウザ内で行われます。文章が外部サーバーへ送信されることはありません。</p></section><footer>文字起こし整形ツール · ブラウザ内処理・データ送信なし</footer></main>
<script>
const input=document.getElementById('input'),output=document.getElementById('output'),mode=document.getElementById('mode'),stats=document.getElementById('stats'),message=document.getElementById('message'),copyBtn=document.getElementById('copy'),downloadBtn=document.getElementById('download');
function norm(s){return s.replace(/[\\t\\u00a0 ]+/g,' ').trim()}
function formatText(text,kind){const n=text.replace(/\\r\\n?/g,'\\n').replace(/[\\u200b\\ufeff]/g,'');if(kind==='compact')return n.split('\\n').map(norm).filter(Boolean).join('');const blocks=n.split(/\\n\\s*\\n+/),joined=blocks.map(b=>b.split('\\n').map(norm).filter(Boolean).join('')).filter(Boolean);if(kind==='sentences')return joined.join('\\n\\n').replace(/([。！？!?])\\s*/g,'$1\\n\\n').replace(/\\n{3,}/g,'\\n\\n').trim();return joined.join('\\n\\n')}
function statsUpdate(){stats.textContent=output.value?output.value.length.toLocaleString()+'文字':'結果はまだありません';copyBtn.disabled=!output.value;downloadBtn.disabled=!output.value}
document.getElementById('format').onclick=()=>{if(!input.value.trim()){message.textContent='先に文字起こしを貼り付けてください。';return}output.value=formatText(input.value,mode.value);statsUpdate();message.textContent='整形しました。内容を確認してコピーまたはTXT保存してください。'};
document.getElementById('clear').onclick=()=>{input.value='';output.value='';statsUpdate();message.textContent='入力と結果をクリアしました。';input.focus()};
output.addEventListener('input',statsUpdate);
copyBtn.onclick=async()=>{try{await navigator.clipboard.writeText(output.value);message.textContent='コピーしました。Googleドキュメントなどに貼り付けてください。'}catch(e){output.focus();output.select();message.textContent='自動コピーできない場合は、選択された文章を Ctrl+C でコピーしてください。'}};
downloadBtn.onclick=()=>{const blob=new Blob(['\\ufeff',output.value],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='整形済み文字起こし.txt';a.click();URL.revokeObjectURL(url);message.textContent='TXTファイルを保存しました.'};statsUpdate();
</script></body></html>
